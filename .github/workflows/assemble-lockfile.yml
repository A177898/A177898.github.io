name: Assemble package-lock
on:
  push:
    branches: [feature/portfolio-foundation]
    paths: ['.lock-b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portfolio-foundation
      - name: Assemble package-lock.json
        run: |
          set -euo pipefail
          count=$(ls .lock-b64/part_*.b64 2>/dev/null | wc -l | tr -d ' ')
          echo "parts=$count"
          if [ "$count" -lt 50 ]; then
            echo "Incomplete parts set; waiting for remaining uploads."
            exit 0
          fi
          cat .lock-b64/part_*.b64 | base64 -d > package-lock.json
          EXPECTED=a9c94b8304a2f92792dbcd557e2ff918d7b4ea4c86bfbd15bd3c2838ca0190e8
          ACTUAL=$(sha256sum package-lock.json | awk '{print $1}')
          echo "size=$(wc -c < package-lock.json)"
          echo "sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf .lock-b64 .lock-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: add package-lock.json"
          git push
