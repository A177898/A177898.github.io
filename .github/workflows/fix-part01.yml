name: Fix lock part 01
on:
  push:
    branches: [feature/portfolio-foundation]
    paths: ['.github/workflows/fix-part01.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portfolio-foundation
      - name: Replace tabs with newlines in part_01
        run: |
          set -euo pipefail
          f=.lock-gz/part_01.b64
          tr '\t' '\n' < "$f" > "$f.tmp"
          mv "$f.tmp" "$f"
          actual=$(git hash-object "$f")
          echo "blob=$actual"
          test "$actual" = "bfb996dec605c17e38bbac9486b9428b3eaebbbd"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "chore: fix gz lock part 01 tabs"
          git push
